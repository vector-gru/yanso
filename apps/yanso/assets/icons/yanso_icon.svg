<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Clip to rounded square -->
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- Background: kola-nut brown -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#2C1A0E"/>

  <!-- Subtle radial inner glow so the disc pops -->
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#3D2512"/>
    <stop offset="100%" stop-color="#2C1A0E"/>
  </radialGradient>
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bgGlow)"/>

  <!-- === 8-SEGMENT DISC === -->
  <!-- Centre: 512,512  Outer radius: 360  Inner (hub) radius: 90 -->
  <!-- Each segment spans 45° (360/8). Segments are separated by a 4px gap rendered as background showing through. -->
  <!-- Colours cycle: gold, terracotta, green, gold, terracotta, green, gold, terracotta -->

  <!-- Segment helper: path draws a pie-slice annulus from startAngle to startAngle+45°
       Outer R=360, Inner R=96, with a 3° gap on each side so segments breathe -->

  <!-- Segment 1: 0°→45° — kente gold #E8A020 -->
  <!-- Arc maths (origin 512,512):
       outer: start = 512+360*cos(-90°)=512,  512+360*sin(-90°)=152   → (512, 152)
              end   = 512+360*cos(-45°)=766.5, 512+360*sin(-45°)=257.5 → (766, 258)
       inner: start = 512+96*cos(-45°)=579.9,  512+96*sin(-45°)=444.2  → (580, 444)
              end   = (512, 512-96)=(512, 416)
  -->

  <!-- We use a Python-free approach: hand-computed path coords for 8×45° slices with a ~4° visual gap. -->

  <!-- GAP = 3° each side → effective sweep = 39° per segment -->
  <!-- Angles (from top/north, clockwise):
       Seg 1:  start=  3°, end= 42°  → math angles: start=-87°, end=-48°
       Seg 2:  start= 48°, end= 87°
       Seg 3:  start= 93°, end=132°
       Seg 4:  start=138°, end=177°
       Seg 5:  start=183°, end=222°
       Seg 6:  start=228°, end=267°
       Seg 7:  start=273°, end=312°
       Seg 8:  start=318°, end=357°
  -->

  <!-- Colour palette -->
  <!-- gold=#E8A020  terra=#C4622D  green=#2D6A4F  -->
  <!-- Pattern: gold, terra, green, gold, terra, green, gold, terra -->

  <!-- cx=512 cy=512 R=360 r=96 -->
  <!-- cos/sin in radians; angle measured from positive-x, counter-clockwise positive -->
  <!-- but SVG y-axis is flipped so clockwise in SVG = increasing angle -->

  <!-- Pre-computed (cx+R*cosA, cy+R*sinA) and (cx+r*cosA, cy+r*sinA) for each boundary angle:
       Angles (clockwise from 12 o'clock) → math angle = angle−90°
       3°  → math -87° : outer=(512+360*cos(-87°),512+360*sin(-87°)) ≈ (530.8, 152.9) inner=(512+96*cos(-87°),512+96*sin(-87°)) ≈ (516.9, 416.8)
       42° → math -48° : outer=(512+360*cos(-48°),512+360*sin(-48°)) ≈ (752.8, 244.5) inner=(96: 576.7, 448.8)
       48° → math -42° : outer≈(779.5, 271.8) inner≈(583.9, 447.3)
       87° → math  -3° : outer≈(871.1, 493.2) inner≈(607.8, 506.5)
       93° → math   3° : outer≈(871.1, 530.8) inner≈(607.8, 517.5)
      132° → math  42° : outer≈(779.5, 752.2) inner≈(583.9, 576.7)
      138° → math  48° : outer≈(752.8, 779.5) inner≈(576.7, 583.9)
      177° → math  87° : outer≈(530.8, 871.1) inner≈(516.9, 607.8)
      183° → math  93° : outer≈(493.2, 871.1) inner≈(505.1, 607.8)
      222° → math 132° : outer≈(271.8, 752.2) inner≈(447.3, 576.7)
      228° → math 138° : outer≈(244.5, 752.8) inner≈(443.4, 583.9)
      267° → math 177° : outer≈(152.9, 530.8) inner≈(416.8, 516.9)
      273° → math 183° : outer≈(152.9, 493.2) inner≈(416.8, 505.1)
      312° → math 222° : outer≈(244.5, 271.8) inner≈(443.4, 447.3)
      318° → math 228° : outer≈(271.8, 244.5) inner≈(447.3, 443.4)
      357° → math 267° : outer≈(530.8, 152.9) inner≈(516.9, 416.8) ← same as 3° (=357° wraps)
  -->

  <!-- Seg 1 (3°→42°, gold) -->
  <path d="M 530.8,152.9 A 360,360 0 0,1 752.8,244.5 L 576.7,448.8 A 96,96 0 0,0 516.9,416.8 Z" fill="#E8A020"/>
  <!-- Seg 2 (48°→87°, terracotta) -->
  <path d="M 779.5,271.8 A 360,360 0 0,1 871.1,493.2 L 607.8,506.5 A 96,96 0 0,0 583.9,447.3 Z" fill="#C4622D"/>
  <!-- Seg 3 (93°→132°, forest green) -->
  <path d="M 871.1,530.8 A 360,360 0 0,1 779.5,752.2 L 583.9,576.7 A 96,96 0 0,0 607.8,517.5 Z" fill="#2D6A4F"/>
  <!-- Seg 4 (138°→177°, gold) -->
  <path d="M 752.8,779.5 A 360,360 0 0,1 530.8,871.1 L 516.9,607.8 A 96,96 0 0,0 576.7,583.9 Z" fill="#E8A020"/>
  <!-- Seg 5 (183°→222°, terracotta) -->
  <path d="M 493.2,871.1 A 360,360 0 0,1 271.8,752.2 L 447.3,576.7 A 96,96 0 0,0 505.1,607.8 Z" fill="#C4622D"/>
  <!-- Seg 6 (228°→267°, forest green) -->
  <path d="M 244.5,752.8 A 360,360 0 0,1 152.9,530.8 L 416.8,516.9 A 96,96 0 0,0 443.4,583.9 Z" fill="#2D6A4F"/>
  <!-- Seg 7 (273°→312°, gold) -->
  <path d="M 152.9,493.2 A 360,360 0 0,1 244.5,271.8 L 443.4,447.3 A 96,96 0 0,0 416.8,505.1 Z" fill="#E8A020"/>
  <!-- Seg 8 (318°→357°, terracotta) -->
  <path d="M 271.8,244.5 A 360,360 0 0,1 530.8,152.9 L 516.9,416.8 A 96,96 0 0,0 447.3,443.4 Z" fill="#C4622D"/>

  <!-- Outer ring border (thin cream) -->
  <circle cx="512" cy="512" r="361" fill="none" stroke="#F5ECD7" stroke-width="6" opacity="0.35"/>

  <!-- Kente accent ring just outside the hub -->
  <!-- Three concentric arcs: gold, terracotta, green — each 120° sectors repeated -->
  <circle cx="512" cy="512" r="108" fill="none" stroke="#E8A020" stroke-width="10" opacity="0.9"/>

  <!-- Hub circle: kola brown so it punches a hole, giving the donut feel -->
  <circle cx="512" cy="512" r="96" fill="#2C1A0E"/>

  <!-- Inner kente ring on hub edge (3-stripe band) -->
  <!-- Gold band -->
  <circle cx="512" cy="512" r="92" fill="none" stroke="#E8A020" stroke-width="6"/>
  <!-- Terracotta band -->
  <circle cx="512" cy="512" r="83" fill="none" stroke="#C4622D" stroke-width="6"/>
  <!-- Green band -->
  <circle cx="512" cy="512" r="74" fill="none" stroke="#2D6A4F" stroke-width="6"/>

  <!-- Hub fill (kola brown inside the triple ring) -->
  <circle cx="512" cy="512" r="68" fill="#2C1A0E"/>

  <!-- Crescent moon at centre — cream, slightly offset to the right to give crescent illusion -->
  <!-- Full circle minus an overlapping circle to carve the crescent -->
  <circle cx="512" cy="512" r="42" fill="#F5ECD7"/>
  <circle cx="527" cy="512" r="36" fill="#2C1A0E"/>

  <!-- Tiny dot accent opposite the crescent (east side) — terracotta -->
  <circle cx="567" cy="512" r="7" fill="#E8A020"/>

</svg>
